version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: engboost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-engboost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-engboost123}
      POSTGRES_DB: ${DB_NAME:-engboost_db}
    ports:
      - "${DB_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME:-engboost_db} -U ${DB_USER:-engboost}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
